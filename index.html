<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<title>Yard Check — Carlingsview Yard</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <h1>🚛 <span id="yard" contenteditable="true" spellcheck="false">Carlingsview Yard</span> — Yard Check</h1>
  <div class="meta">
    <label>Date <input type="date" id="date"></label>
    <label>Time <input type="time" id="time"></label>
    <span class="hint">tap yard name to rename</span>
  </div>
</header>

<main id="sections"><!-- section cards rendered by app.js --></main>

<div class="card notes-card">
  <div class="card-head"><h2>Notes / Remarks</h2></div>
  <textarea id="notes" rows="3" placeholder="e.g. FULL CLIP — 16 pallets, Full Mess, 16 Floor …"></textarea>
</div>

<div class="actions">
  <button id="btn-save" class="btn primary">💾 Save</button>
  <button id="btn-pdf" class="btn">📄 PDF</button>
  <button id="btn-share" class="btn green">✉️ Share</button>
  <button id="btn-new" class="btn ghost">➕ New</button>
  <button id="btn-history" class="btn ghost">📁 <span id="hist-count"></span></button>
</div>

<footer>DRIVER to hand deliver a copy of the yard check to supervisor on duty at <span class="yard-inline">Carlingsview</span></footer>

<dialog id="history-dialog">
  <div class="dlg-head">
    <h3>Saved yard checks</h3>
    <button id="hist-close" class="btn ghost">✕</button>
  </div>
  <ul id="hist-list"></ul>
  <p id="hist-empty" class="hint" hidden>No saved checks yet.</p>
</dialog>

<div id="toast" hidden></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
